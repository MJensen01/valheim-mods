name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build.yml   # same build+package steps as every push; see build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # only for CHANGELOG/README context if a future step needs it

      - uses: actions/download-artifact@v4
        with:
          name: thunderstore-packages
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes

      # UNVERIFIED: tcli's exact publish flags. BUILD-PIPELINE.md (research/BUILD-PIPELINE.md §3)
      # found a real-world example that just does `tcli publish --file X --package-version Y`
      # with TCLI_AUTH_TOKEN in the environment, targeting a repo that only ships one package.
      # This repo ships two (NoVikingLeftBehind + SmoothServer); confirm against `tcli publish --help` (and
      # whether namespace/name need to be passed explicitly or are read from manifest.json
      # inside the zip) before relying on this for a real release — see PUBLISHING.md.
      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          dotnet tool install -g tcli
          export PATH="$PATH:$HOME/.dotnet/tools"
          for zip in dist/*.zip; do
            base="$(basename "$zip" .zip)"      # e.g. NoVikingLeftBehind-0.2.0
            version="${base##*-}"               # e.g. 0.2.0
            echo "Publishing $zip (version $version)"
            tcli publish --file "$zip" --package-version "$version"
          done
